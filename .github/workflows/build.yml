name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev

      - name: Cache JUCE and doctest
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            extra='-G Ninja'
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # The IR comparison test skips itself: the reference captures are not in the repository.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Get pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip -d pluginval

      - name: pluginval (VST3)
        shell: bash
        run: |
          vst3="build/plugin/Glide90_artefacts/Release/VST3/Glide90.vst3"
          case "$RUNNER_OS" in
            Linux)   xvfb-run -a ./pluginval/pluginval --strictness-level 8 --validate-in-process --validate "$vst3" ;;
            Windows) ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "$vst3" ;;
            macOS)   ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --validate "$vst3" ;;
          esac

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/Glide90_artefacts/Release/AU/Glide90.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf G90s Gl9d

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Glide90-${{ matrix.name }}
          path: |
            build/plugin/Glide90_artefacts/Release/VST3
            build/plugin/Glide90_artefacts/Release/AU
            build/plugin/Glide90_artefacts/Release/LV2
            build/plugin/Glide90_artefacts/Release/Standalone
          if-no-files-found: ignore

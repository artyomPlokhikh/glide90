name: build

# main and pull requests build on Linux only, and only when something that gets built has changed.
# Release tags (vX.Y.Z; path filters do not apply to tags) build on all three systems and publish a
# GitHub release with one zip per system. Run by hand (workflow_dispatch) on any branch to build on
# all three before tagging; with "draft release" on, it also makes a draft release to check, then
# delete.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'plugin/**'
      - 'tests/**'
      - 'tools/render/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'plugin/**'
      - 'tests/**'
      - 'tools/render/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      draft_release:
        description: Build as a release and publish it as a draft (to try the release step)
        type: boolean
        default: false

# A newer push to the same branch cancels the run still going; tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write (to publish the release). Third-party actions
# are pinned to commits.
permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  # main and a tag pushed together (git push --atomic origin main vX.Y.Z) would build the same
  # commit twice: the tag's run builds it, main's run stops here.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          build=true release=false
          version=$(sed -n 's/^set(GLIDE90_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            version=${GITHUB_REF_NAME#v}
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.draft_release }}" == true ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && git ls-remote --tags origin | grep -q "^$GITHUB_SHA[[:space:]]refs/tags/v"; then
            echo "This commit has a release tag: its own run builds it."
            build=false
          fi
          linux='{"name":"Linux","os":"ubuntu-24.04","pluginval":"pluginval_Linux.zip"}'
          windows='{"name":"Windows","os":"windows-2022","pluginval":"pluginval_Windows.zip"}'
          macos='{"name":"macOS","os":"macos-14","pluginval":"pluginval_macOS.zip"}'
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            systems="[$linux,$windows,$macos]"
          else
            systems="[$linux]"
          fi
          echo "build=$build release=$release version=$version systems=$systems"
          { echo "build=$build"; echo "release=$release"; echo "version=$version"; echo "systems=$systems"; } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.systems) }}
    env:
      # Compiled files are kept in GitHub's cache: a run compiles only what changed.
      SCCACHE_GHA_ENABLED: 'true'
      RELEASE: ${{ needs.plan.outputs.release }}
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev

      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      # JUCE and doctest, cloned once per version and kept: FetchContent then downloads nothing.
      - name: Dependency versions
        id: deps
        shell: bash
        run: |
          echo "juce=$(sed -n 's/.*GIT_TAG \(.*\)/\1/p' plugin/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
          echo "doctest=$(sed -n 's/.*GIT_TAG \(.*\)/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache JUCE and doctest
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-juce-${{ steps.deps.outputs.juce }}-doctest-${{ steps.deps.outputs.doctest }}
      - name: Get JUCE and doctest
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone -q --depth 1 --branch "${{ steps.deps.outputs.juce }}" https://github.com/juce-framework/JUCE.git .deps/juce
          git clone -q --depth 1 --branch "${{ steps.deps.outputs.doctest }}" https://github.com/doctest/doctest.git .deps/doctest

      - name: Configure
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/.deps/juce"
                -DFETCHCONTENT_SOURCE_DIR_DOCTEST="$PWD/.deps/doctest"
                -DGLIDE90_VERSION="${VERSION%%-*}")
          # Link-time optimisation only for what is released: it is the slow part of the link.
          if [ "$RELEASE" = true ]; then args+=(-DGLIDE90_LTO=ON); else args+=(-DGLIDE90_LTO=OFF); fi
          if [ "$RUNNER_OS" = macOS ]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build

      # The IR comparison test skips itself: the reference captures are not in the repository.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Get pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip -d pluginval

      - name: pluginval (VST3)
        shell: bash
        run: |
          vst3="build/plugin/Glide90_artefacts/Release/VST3/GLIDE90.vst3"
          case "$RUNNER_OS" in
            Linux)   xvfb-run -a ./pluginval/pluginval --strictness-level 8 --validate-in-process --validate "$vst3" ;;
            Windows) ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "$vst3" ;;
            macOS)   ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --validate "$vst3" ;;
          esac

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/Glide90_artefacts/Release/AU/GLIDE90.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx G90s Gl9d

      # One zip per system.
      - name: Package
        shell: bash
        run: |
          sccache --show-stats || true
          if [ "$RELEASE" = true ]; then tag="$VERSION"; else tag="${GITHUB_SHA::7}"; fi
          package() { # target, product name, zip prefix
            local out="build/plugin/$1_artefacts/Release" product="$2"
            local name="$3-$tag-${{ matrix.name }}"
            local dir="dist/$name"
            mkdir -p "$dir"
            cp LICENSE "$dir/LICENSE.txt"
            cp THIRD-PARTY-NOTICES.md "$dir/"
            cp -R licenses "$dir/licenses"
            cp plugin/Resources/fonts/OFL-*.txt "$dir/licenses/"
            cp -R "$out/VST3/$product.vst3" "$dir/"
            case "$RUNNER_OS" in
              Linux)
                cp -R "$out/LV2/$product.lv2" "$dir/"
                cp "$out/Standalone/$product" "$dir/"
                printf '%s\n' "$product $VERSION for Linux (x86_64)" "" \
                  "VST3: copy $product.vst3 to ~/.vst3/" \
                  "LV2: copy $product.lv2 to ~/.lv2/" \
                  "Standalone: run ./$product" > "$dir/INSTALL.txt" ;;
              Windows)
                cp "$out/Standalone/$product.exe" "$dir/"
                printf '%s\r\n' "$product $VERSION for Windows (64-bit)" "" \
                  "VST3: copy the $product.vst3 folder to C:\\Program Files\\Common Files\\VST3\\" \
                  "Standalone: run $product.exe" > "$dir/INSTALL.txt" ;;
              macOS)
                cp -R "$out/AU/$product.component" "$dir/"
                cp -R "$out/Standalone/$product.app" "$dir/"
                printf '%s\n' "$product $VERSION for macOS 11+ (Apple Silicon and Intel)" "" \
                  "VST3: copy $product.vst3 to ~/Library/Audio/Plug-Ins/VST3/" \
                  "AU: copy $product.component to ~/Library/Audio/Plug-Ins/Components/" \
                  "Standalone: copy $product.app to Applications" "" \
                  "The plugin is not signed by Apple. If macOS refuses to open it, run in Terminal:" \
                  "  xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/\"$product.vst3\" \\" \
                  "    ~/Library/Audio/Plug-Ins/Components/\"$product.component\" /Applications/\"$product.app\"" > "$dir/INSTALL.txt" ;;
            esac
            (
              cd dist
              case "$RUNNER_OS" in
                macOS)   ditto -c -k --keepParent "$name" "$name.zip" ;;
                Windows) 7z a -tzip -bso0 "$name.zip" "$name" ;;
                Linux)   zip -qry "$name.zip" "$name" ;;
              esac
            )
          }
          package Glide90 "GLIDE90" "Glide90"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Glide90-${{ matrix.name }}
          path: dist/*.zip
          compression-level: 0 # a zip already
          if-no-files-found: error
          retention-days: 7 # anyone can fetch these in a public repository; releases keep their own zips

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Glide90-*
          merge-multiple: true
          path: dist
      - name: Publish
        shell: bash
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=$GITHUB_REF_NAME
            flags=(--verify-tag)
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
          else
            # Tried by hand: a draft (its tag is only made when published), to delete after.
            tag="ci-test-$GITHUB_RUN_NUMBER"
            flags=(--draft --target "$GITHUB_SHA")
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## Download"
            echo
            echo "One zip per system, each with an INSTALL.txt:"
            echo
            echo "- **Windows** (64-bit): VST3 and the standalone app (.exe)"
            echo "- **macOS** 11+ (Apple Silicon and Intel): VST3, AU and the standalone app. Not signed by Apple: see INSTALL.txt if macOS refuses to open it"
            echo "- **Linux** (x86_64): VST3, LV2 and the standalone app"
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              git log --no-merges --pretty='- %s' "$previous..$GITHUB_SHA"
            fi
          } > notes.md
          gh release create "$tag" dist/*.zip --title "Glide90 $VERSION" --notes-file notes.md "${flags[@]}"
